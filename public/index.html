<script>
    window.onerror=function(m,s,l){var d=document.getElementById("err");d.style.display="block";d.innerHTML+="<div>"+m+" (L"+l+")</div>"};

    const h=React.createElement,{useState:us,useEffect:ue,useCallback:uc,useMemo:um,useRef:ur}=React;
    const K="ledger_pwa_v2"; // legacy localStorage key (자동 마이그레이션용으로만 사용)

    // ===== v19: IndexedDB 분리 저장 (append-only, 데이터/서명 분리) =====
    // v18 문제점: 모든 데이터+서명을 한 키에 통째로 저장 → 10MB 쓰기가 매번 발생 → iOS Safari에서 간헐적 저장 실패
    // v19 해결책:
    //   - meta store: 거래처 cos + 거래 메타(서명 제외) = 0.3MB → 빠른 쓰기
    //   - sigs store: 서명만 txId별로 분리 저장 (append-only, 바뀐 것만 put)
    //   - 저장 완료 후 검증 읽기 → Silent Failure 방지
    const IDB_NAME="ledger_pwa_db";
    const IDB_VER=2; // v18=1, v19=2
    const STORE_KV="ledger_kv"; // v18 호환 (마이그레이션용)
    const STORE_META="ledger_meta"; // v19: cos + txs(서명 제외)
    const STORE_SIGS="ledger_sigs"; // v19: 서명만 (keyPath: txId)
    const META_KEY="main";
    let _dbP=null;
    const openIDB=()=>{
      if(_dbP)return _dbP;
      _dbP=new Promise((res,rej)=>{
        try{
          const req=indexedDB.open(IDB_NAME,IDB_VER);
          req.onerror=()=>rej(req.error||new Error("IndexedDB open failed"));
          req.onupgradeneeded=e=>{
            const db=req.result;
            if(!db.objectStoreNames.contains(STORE_KV))db.createObjectStore(STORE_KV);
            if(!db.objectStoreNames.contains(STORE_META))db.createObjectStore(STORE_META);
            if(!db.objectStoreNames.contains(STORE_SIGS))db.createObjectStore(STORE_SIGS,{keyPath:"txId"});
          };
          req.onsuccess=()=>res(req.result);
        }catch(e){rej(e)}
      });
      return _dbP;
    };
    // v18 호환 (레거시 마이그레이션용)
    const idbGet=async k=>{const db=await openIDB();return new Promise((res,rej)=>{const tx=db.transaction(STORE_KV,"readonly");const r=tx.objectStore(STORE_KV).get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})};
    const idbSet=async(k,v)=>{const db=await openIDB();return new Promise((res,rej)=>{const tx=db.transaction(STORE_KV,"readwrite");const r=tx.objectStore(STORE_KV).put(v,k);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);tx.onerror=()=>rej(tx.error)})};
    // v20: metaGet/metaSet/sigs* 는 storage.js (Supabase)로 이동
    const idbStorageInfo=async()=>{try{if(navigator.storage&&navigator.storage.estimate){const e=await navigator.storage.estimate();const usedMB=((e.usage||0)/1024/1024).toFixed(2);const quotaMB=Math.floor((e.quota||0)/1024/1024);return{used:usedMB,quota:quotaMB}}}catch{}return{used:"?",quota:0}};
    // 거래에서 서명 분리/결합 유틸
    const splitSig=tx=>{const{sig,adminSig,staffSig,...rest}=tx;const hasSig=sig||adminSig||staffSig;return{txNoSig:rest,sigRec:hasSig?{txId:tx.id,sig:sig||null,adminSig:adminSig||null,staffSig:staffSig||null}:null}};
    const mergeSig=(txs,sigMap)=>txs.map(tx=>{const s=sigMap.get(tx.id);if(!s)return tx;const r={...tx};if(s.sig)r.sig=s.sig;if(s.adminSig)r.adminSig=s.adminSig;if(s.staffSig)r.staffSig=s.staffSig;return r});

    const fmt=n=>new Intl.NumberFormat("ko-KR").format(n)+"원";
    const fmtD=s=>{const d=new Date(s);return d.getFullYear()+"."+String(d.getMonth()+1).padStart(2,"0")+"."+String(d.getDate()).padStart(2,"0")};
    const fmtDT=s=>{const d=new Date(s);return fmtD(s)+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};
    const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
    const curMo=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")};
    const mono={fontFamily:"'Space Mono',monospace"};
    const balColor=b=>b<0?"#ef4444":b<100000?"#f59e0b":"#10b981";

    // Icons
    const IP={search:"M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z",plus:"M12 4v16m8-8H4",back:"M19 12H5m7-7l-7 7 7 7",close:"M18 6L6 18M6 6l12 12",home:"M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0h4",lock:"M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z",settings:"M10.3 1.5l-.2 1.1c-.4.2-.8.4-1.2.7l-1-.4-1.3 2.2.8.7c0 .4 0 .9.1 1.3l-.8.8 1.3 2.2 1-.3c.3.3.7.5 1.2.7l.2 1.1h2.5l.2-1.1c.4-.2.8-.4 1.2-.7l1 .4 1.3-2.2-.8-.8c0-.4 0-.9-.1-1.3l.8-.7-1.3-2.2-1 .3c-.3-.3-.7-.5-1.2-.7l-.2-1.1h-2.5zM11.5 10a2 2 0 110-4 2 2 0 010 4z",trash:"M19 7l-.9 12a2 2 0 01-2 1.8H7.9a2 2 0 01-2-1.8L5 7m5 4v6m4-6v6M1 7h22M8 7V4a1 1 0 011-1h6a1 1 0 011 1v3",download:"M12 4v12m0 0l-4-4m4 4l4-4M4 18h16",upload:"M12 16V4m0 0L8 8m4-4l4 4M4 18h16",user:"M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z",phone2:"M3 5a2 2 0 012-2h3.28a1 1 0 01.95.68l1.5 4.49a1 1 0 01-.5 1.21L8.09 10.7a11 11 0 005.22 5.22l1.32-2.14a1 1 0 011.21-.5l4.49 1.5a1 1 0 01.68.95V19a2 2 0 01-2 2h-1C9.72 21 3 14.28 3 6V5z",chart:"M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6m6 0h6m0 0v-8a2 2 0 012-2h2a2 2 0 012 2v8M9 19H3m12 0h6",bldg:"M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0H5m14 0h2M5 21H3m4-4h2m4 0h2M9 9h2m4 0h2M9 13h2m4 0h2"};
    function Ic({type:t,size:s=20,color:c="#1e293b"}){return h("svg",{width:s,height:s,viewBox:"0 0 24 24",fill:"none",stroke:c,strokeWidth:2,strokeLinecap:"round",strokeLinejoin:"round"},h("path",{d:IP[t]||""}))}

    // Shared styles
    const inp={width:"100%",padding:"12px 14px",borderRadius:"10px",border:"1px solid #e2e8f0",fontSize:"14px",outline:"none"};
    const btn1={padding:"14px 20px",borderRadius:"12px",border:"none",color:"#fff",fontSize:"14px",fontWeight:"700",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:"6px"};
    const crd={background:"#fff",borderRadius:"12px",border:"1px solid #e2e8f0",padding:"14px 16px",marginBottom:"6px",cursor:"pointer"};
    const mkPill=a=>({padding:"6px 14px",borderRadius:"20px",border:a?"2px solid #3b82f6":"1px solid #e2e8f0",background:a?"#eff6ff":"#fff",color:a?"#3b82f6":"#64748b",fontSize:"12px",fontWeight:"600",cursor:"pointer"});
    const mkStat=c=>({background:"#fff",borderRadius:"12px",border:"1px solid #e2e8f0",padding:"14px",boxShadow:"0 1px 4px rgba(0,0,0,0.03)"});

    // Modal
    function Modal({open:o,onClose:cl,title:t,children:ch,wide:w}){if(!o)return null;return h("div",{style:{position:"fixed",inset:0,zIndex:1000,display:"flex",alignItems:w?"flex-end":"center",justifyContent:"center",background:"rgba(0,0,0,0.35)"},onClick:cl},h("div",{onClick:ev=>ev.stopPropagation(),style:{background:"#fff",borderRadius:w?"20px 20px 0 0":"20px",padding:"24px 20px",width:w?"100%":"min(440px,92vw)",maxHeight:w?"85vh":"80vh",overflow:"auto",boxShadow:"0 -4px 30px rgba(0,0,0,0.1)"}},h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"18px"}},h("h3",{style:{margin:0,fontSize:"16px",fontWeight:"800"}},t),h("button",{onClick:cl,style:{background:"none",border:"none",cursor:"pointer"}},h(Ic,{type:"close",size:20,color:"#94a3b8"}))),ch))}

    // Signature Pad
    function SigPad({onSave:os,onCancel:oc,label:lb}){
      const ref=ur(null),lp=ur(null),[dr,setDr]=us(false),[hd,setHd]=us(false);
      const getXY=(ev,c)=>{const r=c.getBoundingClientRect();const t=ev.touches?ev.touches[0]:ev;const sx=c.width/r.width;const sy=c.height/r.height;return[(t.clientX-r.left)*sx,(t.clientY-r.top)*sy]};
      const start=ev=>{ev.preventDefault();const c=ref.current;const ctx=c.getContext("2d");const[x,y]=getXY(ev,c);ctx.beginPath();ctx.moveTo(x,y);lp.current={x,y};setDr(true);setHd(true)};
      const move=ev=>{if(!dr)return;ev.preventDefault();const c=ref.current;const ctx=c.getContext("2d");const[x,y]=getXY(ev,c);ctx.strokeStyle="#1e293b";ctx.lineWidth=2.5;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(lp.current.x,lp.current.y);ctx.lineTo(x,y);ctx.stroke();lp.current={x,y}};
      const end=()=>setDr(false);
      const clear=()=>{const c=ref.current;c.getContext("2d").clearRect(0,0,c.width,c.height);setHd(false)};
      const save=()=>{if(hd){const c=ref.current;const tc=document.createElement("canvas");tc.width=240;tc.height=100;const tctx=tc.getContext("2d");tctx.fillStyle="#f8fafc";tctx.fillRect(0,0,240,100);tctx.drawImage(c,0,0,240,100);os(tc.toDataURL("image/jpeg",0.35))}};
      return h("div",null,
        lb&&h("div",{style:{fontSize:"13px",fontWeight:"700",color:"#1e293b",marginBottom:"8px"}},lb),
        h("div",{style:{background:"#f8fafc",borderRadius:"12px",border:"1px solid #e2e8f0",padding:"6px",marginBottom:"10px"}},
          h("canvas",{ref,width:500,height:200,style:{width:"100%",height:"160px",borderRadius:"8px",background:"#fff",border:"1px dashed #cbd5e1"},onMouseDown:start,onMouseMove:move,onMouseUp:end,onMouseLeave:end,onTouchStart:start,onTouchMove:move,onTouchEnd:end})),
        h("div",{style:{display:"flex",gap:"8px"}},
          h("button",{onClick:oc,style:{flex:1,padding:"13px",borderRadius:"10px",border:"1px solid #e2e8f0",background:"#fff",color:"#64748b",fontSize:"13px",fontWeight:"600",cursor:"pointer"}},"← 이전"),
          h("button",{onClick:clear,style:{padding:"13px 16px",borderRadius:"10px",border:"1px solid #fecaca",background:"#fef2f2",color:"#ef4444",fontSize:"13px",fontWeight:"600",cursor:"pointer"}},"지우기"),
          h("button",{onClick:save,style:{flex:2,padding:"13px",borderRadius:"10px",border:"none",background:hd?"linear-gradient(135deg,#3b82f6,#2563eb)":"#e2e8f0",color:hd?"#fff":"#94a3b8",fontSize:"13px",fontWeight:"700",cursor:hd?"pointer":"default"}},"서명 완료")));
    }

    // NumPad
    function NumPad({label:lb,onOk:ok,onNo:no}){
      const[d,setD]=us("");const v=parseInt(d)||0;
      const add=n=>{if(n==="C")setD("");else if(n==="←")setD(p=>p.slice(0,-1));else setD(p=>p+n)};
      const quicks=[5000,10000,30000,50000];
      return h("div",null,
        h("div",{style:{textAlign:"center",marginBottom:"10px"}},h("div",{style:{fontSize:"11px",color:"#94a3b8",marginBottom:"3px"}},lb||"금액"),h("div",{style:{fontSize:"28px",fontWeight:"800",color:v>0?"#1e293b":"#cbd5e1",...mono,minHeight:"36px"}},v>0?fmt(v):"0원")),
        h("div",{style:{display:"flex",gap:"5px",marginBottom:"8px",justifyContent:"center"}},...quicks.map(q=>h("button",{key:q,onClick:()=>setD(p=>String((parseInt(p)||0)+q)),style:{padding:"6px 10px",borderRadius:"8px",border:"1px solid #e2e8f0",background:"#f8fafc",fontSize:"11px",fontWeight:"600",color:"#3b82f6",cursor:"pointer",...mono}},"+"+fmt(q).replace("원","")))),
        h("div",{style:{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"5px",marginBottom:"10px"}},...["1","2","3","4","5","6","7","8","9","C","0","←"].map(n=>h("button",{key:n,onClick:()=>add(n),style:{padding:"14px",borderRadius:"10px",border:"1px solid #e2e8f0",background:n==="C"?"#fef2f2":n==="←"?"#f8fafc":"#fff",fontSize:"18px",fontWeight:"600",color:n==="C"?"#ef4444":"#1e293b",cursor:"pointer",...mono}},n))),
        h("div",{style:{display:"flex",gap:"8px"}},
          h("button",{onClick:no,style:{flex:1,...btn1,background:"#fff",border:"1px solid #e2e8f0",color:"#64748b"}},"취소"),
          h("button",{onClick:()=>{if(v>0)ok(v)},style:{flex:2,...btn1,background:v>0?"linear-gradient(135deg,#3b82f6,#2563eb)":"#e2e8f0",color:v>0?"#fff":"#94a3b8"}},"확인")));
    }

    // Step Indicator
    function Steps({current:cur,steps:st}){
      const ci=st.findIndex(s=>s[0]===cur);
      return h("div",{style:{display:"flex",alignItems:"center",justifyContent:"center",gap:"4px",marginBottom:"16px"}},...st.map(([k,l],i)=>h("div",{key:k,style:{display:"flex",alignItems:"center",gap:"4px"}},h("div",{style:{display:"flex",alignItems:"center",gap:"3px"}},h("div",{style:{width:"22px",height:"22px",borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"10px",fontWeight:"700",background:cur===k?"#3b82f6":ci>i?"#10b981":"#e2e8f0",color:cur===k||ci>i?"#fff":"#94a3b8"}},ci>i?"✓":i+1),h("span",{style:{fontSize:"10px",fontWeight:"600",color:cur===k?"#1e293b":"#94a3b8"}},l)),i<st.length-1&&h("div",{style:{width:"12px",height:"1px",background:"#e2e8f0"}}))));
    }

    // ===================== MAIN APP =====================
    function App(){
      // === ALL STATE (no conditionals before hooks) ===
      const[data,setData]=us({cos:[],txs:[]});
      const[mode,setMode]=us(null);
      const[view,setView]=us("home");
      const[sel,setSel]=us(null);
      const[q,setQ]=us("");
      const[modals,setModals]=us({});
      const[clipData,setClipData]=us("");
      const[showClip,setShowClip]=us(false);
      const[showPaste,setShowPaste]=us(false);
      const[pasteData,setPasteData]=us("");
      const[form,setForm]=us({name:"",manager:"",phone:"",ppl:1,staff:"",memo:"",editAmt:"",editDesc:"",editStaff:"",editPpl:1,depClientName:"",depAdminName:""});
      const[toast,setToast]=us({msg:"",show:false,type:"s"});
      const[month,setMonth]=us(curMo());
      const[sort,setSort]=us("name");
      const[filt,setFilt]=us("all");
      const[useStep,setUseStep]=us("info");
      const[useAmt,setUseAmt]=us(0);
      const[useClientSig,setUseClientSig]=us(null);
      const[depStep,setDepStep]=us("amount");
      const[depAmt,setDepAmt]=us(0);
      const[depCSig,setDepCSig]=us(null);
      const[depASig,setDepASig]=us(null);
      const[viewTxn,setViewTxn]=us(null);
      const[guestQ,setGuestQ]=us("");
      const[editTxn,setEditTxn]=us(null);
      const[completePop,setCompletePop]=us(null);
      const[depPop,setDepPop]=us(null);
      const[exFrom,setExFrom]=us("");
      const[exTo,setExTo]=us("");
      const[showExport,setShowExport]=us(false);
      const[homeMenu,setHomeMenu]=us(null);







      const[backupInfo,setBackupInfo]=us({last:"없음",count:0,size:"0"});
      const fileRef=ur(null);
      const autoRef=ur(false);
      // v18: 오래된 거래 정리 선택 상태
      const[cleanMo,setCleanMo]=us(null); // null이면 미선택, 1~18
      // v19: 저장 상태 표시 (Silent Failure 방지)
      const[saveState,setSaveState]=us({status:"idle",msg:""}); // idle | saving | success | error

      // ===== v19-setup: 임베디드 10/15 백업 데이터 =====
      const[seedInfo,setSeedInfo]=us(null);
      const[seedApplied,setSeedApplied]=us(false);
      const[seedApplying,setSeedApplying]=us(false);

      // ===== v19-recovery: 자동백업 조회/추출 =====
      const[autoBackups,setAutoBackups]=us(null); // null=미조회, []=없음, [{key,date,cos,txs,latestTx,sizeMB,hasLostData}]
      const[autoScanning,setAutoScanning]=us(false);
      const[autoExporting,setAutoExporting]=us(null); // 현재 exporting 중인 key
      // 유실 구간: 10/12 09:43:49 ~ 10/14 10:58:30
      const LOST_START="2026-10-12T09:43:49.414Z";
      const LOST_END="2026-10-14T10:58:30.117Z";

      const scanAutoBackups=async()=>{
        setAutoScanning(true);
        try{
          const db=await openIDB();
          // ledger_kv에서 모든 키 조회
          const keys=await new Promise((res,rej)=>{
            const tx=db.transaction(STORE_KV,"readonly");
            const r=tx.objectStore(STORE_KV).getAllKeys();
            r.onsuccess=()=>res(r.result||[]);
            r.onerror=()=>rej(r.error);
          });
          const autoKeys=keys.filter(k=>typeof k==="string"&&k.startsWith("autobackup_")).sort().reverse();
          if(autoKeys.length===0){
            setAutoBackups([]);
            setAutoScanning(false);
            return;
          }
          // 각 스냅샷 요약 조회
          const results=[];
          for(const key of autoKeys){
            try{
              const snap=await new Promise((res,rej)=>{
                const tx=db.transaction(STORE_KV,"readonly");
                const r=tx.objectStore(STORE_KV).get(key);
                r.onsuccess=()=>res(r.result);
                r.onerror=()=>rej(r.error);
              });
              if(!snap)continue;
              const txs=snap.txs||[];
              const cos=snap.cos||[];
              const dates=txs.map(t=>t.date).filter(Boolean).sort();
              const latestTx=dates.length>0?dates[dates.length-1]:"-";
              // 유실 구간 데이터 포함 여부
              const lostCount=txs.filter(t=>t.date>LOST_START&&t.date<LOST_END).length;
              // 크기 추정 (서명 포함)
              let sigBytes=0;txs.forEach(t=>{if(t.sig)sigBytes+=t.sig.length;if(t.adminSig)sigBytes+=t.adminSig.length;if(t.staffSig)sigBytes+=t.staffSig.length});
              const totalBytes=JSON.stringify(snap).length;
              results.push({
                key,
                date:key.replace("autobackup_",""),
                cos:cos.length,
                txs:txs.length,
                latestTx:latestTx.substring(0,19).replace("T"," "),
                sigMB:(sigBytes/1024/1024).toFixed(2),
                sizeMB:(totalBytes/1024/1024).toFixed(2),
                lostCount,
                snapDate:snap._date||"-"
              });
            }catch(e){console.error("Scan error for "+key,e)}
          }

      // v19: 자동백업 - 메타만 스냅샷 (서명은 별도 저장소라 중복 저장 안 함)

      const save=async d=>{

          // 1. 서명/메타 분리

          }

          // 2. 메타 저장 (0.3MB, 빠름) - 메인 쓰기 포인트
          const metaPayload={cos:d.cos,txs:txsNoSig};

          const check=await metaGet();

          }

          // 4. 서명 append-only (이미 저장된 건 skip)
          const newSigs=curSigs.filter(s=>!savedSigIds.current.has(s.txId));

            await sigsPut(newSigs);

          }

          const toDeleteSigIds=[...savedSigIds.current].filter(id=>!curSigIds.has(id)&&!d.txs.find(t=>t.id===id));

            cleanMo&&cleanPrev&&cleanPrev.count>0&&h("button",{onClick:()=>doClean(cleanMo),style:{width:"100%",padding:"12px",borderRadius:"10px",border:"none",background:cleanMo<=3?"linear-gradient(135deg,#ef4444,#dc2626)":"linear-gradient(135deg,#f59e0b,#d97706)",color:"#fff",fontSize:"13px",fontWeight:"700",cursor:"pointer",marginBottom:"4px"}},"🗑️ "+cleanMo+"개월 이전 "+cleanPrev.count+"건 삭제 실행"),
            h("button",{onClick:doStripSigs,style:{display:"flex",alignItems:"center",justifyContent:"center",gap:"8px",padding:"12px",borderRadius:"10px",border:"1px solid #fde68a",background:"#fffbeb",color:"#92400e",fontSize:"12px",fontWeight:"700",cursor:"pointer"}},"🖊️ 서명 이미지만 정리 (거래는 유지)"),
            // v19 recovery: 자동백업 조회/추출
            h("div",{style:{borderTop:"2px solid #dbeafe",margin:"8px 0 4px",paddingTop:"8px"}}),
            h("div",{style:{fontSize:"13px",fontWeight:"800",color:"#2563eb",marginBottom:"4px"}},"🔍 과거 자동백업 조회/추출"),
            h("div",{style:{fontSize:"11px",color:"#64748b",marginBottom:"8px",lineHeight:"1.5"}},"v18이 매일 저장한 자동 스냅샷을 조회합니다. 10/12~10/14 유실 데이터가 있는지 확인하고 복구할 수 있습니다."),
            !autoBackups&&h("button",{onClick:scanAutoBackups,disabled:autoScanning,style:{width:"100%",padding:"14px",borderRadius:"12px",border:"none",background:autoScanning?"#e2e8f0":"linear-gradient(135deg,#3b82f6,#2563eb)",color:autoScanning?"#94a3b8":"#fff",fontSize:"14px",fontWeight:"700",cursor:autoScanning?"default":"pointer",marginBottom:"8px"}},autoScanning?"🔎 조회 중...":"🔍 자동백업 조회 시작"),
            autoBackups&&autoBackups.length===0&&h("div",{style:{padding:"14px",background:"#fef2f2",borderRadius:"10px",border:"1px solid #fecaca",color:"#dc2626",fontSize:"12px",fontWeight:"600",textAlign:"center",marginBottom:"8px"}},"⚠️ 자동백업 데이터 없음 (복구 불가)"),
            autoBackups&&autoBackups.length>0&&h("div",{style:{display:"flex",flexDirection:"column",gap:"6px",marginBottom:"8px"}},
              h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 10px",background:"#eff6ff",borderRadius:"8px",fontSize:"12px"}},
                h("span",{style:{color:"#2563eb",fontWeight:"700"}},"총 "+autoBackups.length+"개 발견"),
                h("button",{onClick:exportAllAutoBackups,disabled:autoExporting==="ALL",style:{padding:"6px 10px",borderRadius:"6px",border:"none",background:"#2563eb",color:"#fff",fontSize:"11px",fontWeight:"700",cursor:autoExporting==="ALL"?"default":"pointer"}},autoExporting==="ALL"?"내보내는 중...":"📥 전체 묶음 다운로드")),
              ...autoBackups.map(ab=>h("div",{key:ab.key,style:{padding:"10px 12px",background:ab.lostCount>0?"#f0fdf4":"#f8fafc",borderRadius:"8px",border:"1px solid "+(ab.lostCount>0?"#86efac":"#e2e8f0")}},
                h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"4px"}},
                  h("div",{style:{fontSize:"13px",fontWeight:"800",color:ab.lostCount>0?"#16a34a":"#1e293b"}},"📦 "+ab.date,ab.lostCount>0&&h("span",{style:{marginLeft:"6px",padding:"2px 6px",background:"#16a34a",color:"#fff",fontSize:"10px",borderRadius:"4px"}},"유실 "+ab.lostCount+"건 포함! 🎉")),
                  h("div",{style:{fontSize:"10px",color:"#94a3b8"}},ab.sizeMB+"MB")),
                h("div",{style:{fontSize:"11px",color:"#64748b",marginBottom:"6px"}},"거래처 ",ab.cos,"개 · 거래 ",h("b",null,ab.txs+"건")," · 최신 ",ab.latestTx),
                h("div",{style:{display:"flex",gap:"4px"}},
                  h("button",{onClick:()=>exportAutoBackup(ab.key,ab.date),disabled:autoExporting===ab.key,style:{flex:1,padding:"8px",borderRadius:"6px",border:"1px solid #93c5fd",background:autoExporting===ab.key?"#e2e8f0":"#eff6ff",color:autoExporting===ab.key?"#94a3b8":"#2563eb",fontSize:"11px",fontWeight:"700",cursor:autoExporting===ab.key?"default":"pointer"}},autoExporting===ab.key?"내보내는 중...":"💾 전체 다운로드"),
                  ab.lostCount>0&&h("button",{onClick:()=>exportLostOnly(ab.key,ab.date),disabled:autoExporting===ab.key+"_lost",style:{flex:1,padding:"8px",borderRadius:"6px",border:"1px solid #86efac",background:autoExporting===ab.key+"_lost"?"#e2e8f0":"#f0fdf4",color:autoExporting===ab.key+"_lost"?"#94a3b8":"#16a34a",fontSize:"11px",fontWeight:"700",cursor:autoExporting===ab.key+"_lost"?"default":"pointer"}},autoExporting===ab.key+"_lost"?"추출 중...":"🎯 유실분만 추출"))))),
            autoBackups&&h("button",{onClick:scanAutoBackups,disabled:autoScanning,style:{width:"100%",padding:"8px",borderRadius:"8px",border:"1px solid #cbd5e1",background:"#fff",color:"#64748b",fontSize:"11px",fontWeight:"600",cursor:autoScanning?"default":"pointer",marginBottom:"8px"}},autoScanning?"조회 중...":"🔄 다시 조회"),
            h("div",{style:{borderTop:"1px solid #f1f5f9",margin:"4px 0"}}),
            h("button",{onClick:doReset,style:{display:"flex",alignItems:"center",justifyContent:"center",gap:"8px",padding:"14px",borderRadius:"12px",border:"1px solid #fecaca",background:"#fef2f2",color:"#ef4444",fontSize:"14px",fontWeight:"700",cursor:"pointer"}},"🗑️ 전체 초기화"))));
    }

    ReactDOM.render(h(App),document.getElementById("root"));
</script>
