//   - meta store: 거래처 cos + 거래 메타(서명 제외) = 0.3MB → 빠른 쓰기

//   - 저장 완료 후 검증 읽기 → Silent Failure 방지
const IDB_NAME="ledger_pwa_db";
const IDB_VER=2; // v18=1, v19=2
const STORE_KV="ledger_kv"; // v18 호환 (마이그레이션용)
const STORE_META="ledger_meta"; // v19: cos + txs(서명 제외)
const STORE_SIGS="ledger_sigs"; // v19: 서명만 (keyPath: txId)
const META_KEY="main";
let _dbP=null;
const openIDB=()=>{
  if(_dbP)return _dbP;
  _dbP=new Promise((res,rej)=>{
    try{
      const req=indexedDB.open(IDB_NAME,IDB_VER);
      req.onerror=()=>rej(req.error||new Error("IndexedDB open failed"));
      req.onupgradeneeded=e=>{
        const db=req.result;
        if(!db.objectStoreNames.contains(STORE_KV))db.createObjectStore(STORE_KV);
        if(!db.objectStoreNames.contains(STORE_META))db.createObjectStore(STORE_META);
        if(!db.objectStoreNames.contains(STORE_SIGS))db.createObjectStore(STORE_SIGS,{keyPath:"txId"});
      };
      req.onsuccess=()=>res(req.result);
    }catch(e){rej(e)}
  });
  return _dbP;
};
// v18 호환 (레거시 마이그레이션용)
const idbGet=async k=>{const db=await openIDB();return new Promise((res,rej)=>{const tx=db.transaction(STORE_KV,"readonly");const r=tx.objectStore(STORE_KV).get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})};
const idbSet=async(k,v)=>{const db=await openIDB();return new Promise((res,rej)=>{const tx=db.transaction(STORE_KV,"readwrite");const r=tx.objectStore(STORE_KV).put(v,k);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);tx.onerror=()=>rej(tx.error)})};

function SigPad({onSave:os,onCancel:oc,label:lb}){
  const ref=ur(null),lp=ur(null),[dr,setDr]=us(false),[hd,setHd]=us(false);

  const start=ev=>{ev.preventDefault();const c=ref.current;const ctx=c.getContext("2d");const[x,y]=getXY(ev,c);ctx.beginPath();ctx.moveTo(x,y);lp.current={x,y};setDr(true);setHd(true)};
  const move=ev=>{if(!dr)return;ev.preventDefault();const c=ref.current;const ctx=c.getContext("2d");const[x,y]=getXY(ev,c);ctx.strokeStyle="#1e293b";ctx.lineWidth=2.5;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(lp.current.x,lp.current.y);ctx.lineTo(x,y);ctx.stroke();lp.current={x,y}};
  const end=()=>setDr(false);

  const scanAutoBackups=async()=>{
    setAutoScanning(true);
    try{
      const db=await openIDB();
      // ledger_kv에서 모든 키 조회
      const keys=await new Promise((res,rej)=>{
        const tx=db.transaction(STORE_KV,"readonly");
        const r=tx.objectStore(STORE_KV).getAllKeys();
        r.onsuccess=()=>res(r.result||[]);
        r.onerror=()=>rej(r.error);
      });
      const autoKeys=keys.filter(k=>typeof k==="string"&&(k.startsWith("autobackup_")||k.startsWith("prerestore_"))).sort().reverse();
      if(autoKeys.length===0){
        setAutoBackups([]);
        setAutoScanning(false);
        return;
      }
      // 각 스냅샷 요약 조회
      const results=[];
      for(const key of autoKeys){
        try{
          const snap=await new Promise((res,rej)=>{
            const tx=db.transaction(STORE_KV,"readonly");
            const r=tx.objectStore(STORE_KV).get(key);
            r.onsuccess=()=>res(r.result);
            r.onerror=()=>rej(r.error);
          });
          if(!snap)continue;
          const txs=snap.txs||[];
          const cos=snap.cos||[];
          const dates=txs.map(t=>t.date).filter(Boolean).sort();
          const latestTx=dates.length>0?dates[dates.length-1]:"-";

  // v19.2: 파일 병합 - 기존 거래는 절대 바꾸지 않고, 장부에 없는 거래(ID 기준)만 추가
  // 지원 형식: 수동백업/자동백업/유실분 추출 {cos,txs}, 전체 자동백업 묶음 {autobackups:{키:{cos,txs}}}
  const readAsText=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error("파일 읽기 실패: "+f.name));r.readAsText(f)});
  const doMerge=async ev=>{
    const files=[...(ev.target.files||[])];ev.target.value="";
    if(!files.length)return;
    notify("📥 병합할 파일 읽는 중... ("+files.length+"개)");
    try{
      const have=new Map(data.txs.map(t=>[t.id,t]));
      const haveCo=new Set(data.cos.map(c=>c.id));
      const srcCos=new Map();const addTx=new Map();
      let dup=0,diff=0,orphan=0,total=0;
      const fill=new Map(); // v19.3: 기존 거래에 빠진 서명 {sig,adminSig,staffSig}
      const same=(a,b)=>a.cid===b.cid&&a.type===b.type&&a.amount===b.amount&&a.date===b.date;
      const take=(snap)=>{
        (snap.cos||[]).forEach(c=>{if(c&&c.id&&!srcCos.has(c.id))srcCos.set(c.id,c)});
        (snap.txs||[]).forEach(t=>{
          if(!t||!t.id||!t.cid||!t.date||typeof t.amount!=="number")return;
          total++;
          const ex=have.get(t.id);
          if(ex){
            if(same(ex,t)){dup++;
              const need=["sig","adminSig","staffSig"].filter(k=>!ex[k]&&t[k]);
              if(need.length){const f=fill.get(t.id)||{};need.forEach(k=>{if(!f[k])f[k]=t[k]});fill.set(t.id,f)}
            }else diff++;
            return}
          const prev=addTx.get(t.id);
          if(!prev){addTx.set(t.id,t);return}
          // 같은 거래가 여러 파일에 있으면 서명이 있는 쪽을 사용
          if(!(prev.sig||prev.staffSig||prev.adminSig)&&(t.sig||t.staffSig||t.adminSig))addTx.set(t.id,t);
        });
      };
      for(const f of files){
        const p=JSON.parse(await readAsText(f));
        if(p&&p.autobackups&&typeof p.autobackups==="object")Object.values(p.autobackups).forEach(s=>s&&take(s));
        else if(p&&Array.isArray(p.txs))take(p);
        else throw new Error(f.name+": 장부 백업 형식이 아닙니다");
      }
      // 새 거래에 필요한 거래처만 추가 (예전에 지운 거래처가 되살아나지 않도록)
      const newCos=[];const finalTx=[];
      for(const t of addTx.values()){
        if(haveCo.has(t.cid)){finalTx.push(t);continue}
        const c=srcCos.get(t.cid);
        if(c){if(!newCos.find(x=>x.id===c.id))newCos.push(c);finalTx.push(t)}else orphan++;
      }
      const sigFill=fill.size;
      if(!finalTx.length&&!sigFill){
        alert("✅ 추가할 새 거래가 없습니다.\n\n파일 속 거래 "+total+"건 중\n· 이미 장부에 있음: "+dup+"건"+(diff?"\n· 같은 거래인데 내용이 다름: "+diff+"건 (기존 장부 유지)":"")+(orphan?"\n· 거래처 정보가 없어 건너뜀: "+orphan+"건":""));
        return;
      }
      const dep=finalTx.filter(t=>t.type==="deposit"),use=finalTx.filter(t=>t.type!=="deposit");
      const sum=a=>a.reduce((s,t)=>s+t.amount,0);
      const kst=s=>{const d=new Date(new Date(s).getTime()+9*3600e3).toISOString();return d.substring(5,10).replace("-","/")+" "+d.substring(11,16)};
      const ds=finalTx.map(t=>t.date).sort();
      const msg="➕ 파일 병합 (기존 장부는 그대로 두고 추가만 합니다)\n\n"+
        (finalTx.length?"새로 추가: "+finalTx.length+"건 ("+kst(ds[0])+" ~ "+kst(ds[ds.length-1])+")\n"+
        "  · 충전 "+dep.length+"건 "+fmt(sum(dep))+"\n  · 사용 "+use.length+"건 "+fmt(sum(use))+"\n"+
        "  · 잔액 변화 "+(sum(dep)-sum(use)>=0?"+":"")+fmt(sum(dep)-sum(use))+"\n":"새로 추가: 0건 (금액·잔액 변화 없음)\n")+
        (sigFill?"🖊️ 서명 보충: "+sigFill+"건 (이미 있는 거래에 빠진 서명만 채움)\n":"")+
        (newCos.length?"새 거래처: "+newCos.map(c=>c.name).join(", ")+"\n":"")+
        "\n건너뜀: 이미 있는 거래 "+dup+"건"+(diff?", 내용이 다른 거래 "+diff+"건(기존 유지)":"")+(orphan?", 거래처 없음 "+orphan+"건":"")+
        "\n\n장부: "+data.txs.length+"건 → "+(data.txs.length+finalTx.length)+"건\n병합 전 장부는 '복원 직전 스냅샷'으로 자동 보관됩니다.\n\n추가하시겠습니까?";
      if(!confirm(msg))return;
      await snapshotBefore("파일 병합: "+files.map(f=>f.name).join(", "));
      const filled=data.txs.map(t=>{const f=fill.get(t.id);return f?{...t,...f}:t});
      await save({cos:[...data.cos,...newCos],txs:[...filled,...finalTx]});
      if(sigFill){
        // 이미 서명 기록이 있던 거래(일부 서명만 빠진 경우)도 확실히 갱신
        const recs=filled.filter(t=>fill.has(t.id)).map(t=>({txId:t.id,sig:t.sig||null,adminSig:t.adminSig||null,staffSig:t.staffSig||null}));
        await sigsPut(recs);recs.forEach(r=>savedSigIds.current.add(r.txId));
      }
      notify("✅ 병합 완료: "+finalTx.length+"건 추가"+(sigFill?", 서명 "+sigFill+"건 보충":"")+" (총 "+(data.txs.length+finalTx.length)+"건)");
      closeM("settings");
    }catch(e){
      notify("병합 실패: "+(e.message||"파일 오류"),"e");console.error("Merge error:",e);
    }
  };

              h("div",null,"보존: ",h("b",{style:{color:"#16a34a"}},cleanPrev.keep+"건"),h("span",{style:{fontSize:"10px",color:"#94a3b8"}}," · 거래처 잔액 유지")),

        // v19 recovery: 자동백업 조회/추출
        h("div",{style:{borderTop:"2px solid #dbeafe",margin:"8px 0 4px",paddingTop:"8px"}}),
        h("div",{style:{fontSize:"13px",fontWeight:"800",color:"#2563eb",marginBottom:"4px"}},"🔍 과거 자동백업 조회/추출"),
        h("div",{style:{fontSize:"11px",color:"#64748b",marginBottom:"8px",lineHeight:"1.5"}},"매일 자동 스냅샷과, 복원·초기화·정리 직전에 자동 보관된 '복원직전' 스냅샷을 조회합니다. 실수로 덮어썼다면 '복원직전' 항목을 다운로드해 복원하세요."),
        !autoBackups&&h("button",{onClick:scanAutoBackups,disabled:autoScanning,style:{width:"100%",padding:"14px",borderRadius:"12px",border:"none",background:autoScanning?"#e2e8f0":"linear-gradient(135deg,#3b82f6,#2563eb)",color:autoScanning?"#94a3b8":"#fff",fontSize:"14px",fontWeight:"700",cursor:autoScanning?"default":"pointer",marginBottom:"8px"}},autoScanning?"🔎 조회 중...":"🔍 자동백업 조회 시작"),

          h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 10px",background:"#eff6ff",borderRadius:"8px",fontSize:"12px"}},
            h("span",{style:{color:"#2563eb",fontWeight:"700"}},"총 "+autoBackups.length+"개 발견"),
            h("button",{onClick:exportAllAutoBackups,disabled:autoExporting==="ALL",style:{padding:"6px 10px",borderRadius:"6px",border:"none",background:"#2563eb",color:"#fff",fontSize:"11px",fontWeight:"700",cursor:autoExporting==="ALL"?"default":"pointer"}},autoExporting==="ALL"?"내보내는 중...":"📥 전체 묶음 다운로드")),
          ...autoBackups.map(ab=>h("div",{key:ab.key,style:{padding:"10px 12px",background:ab.lostCount>0?"#f0fdf4":"#f8fafc",borderRadius:"8px",border:"1px solid "+(ab.lostCount>0?"#86efac":"#e2e8f0")}},
            h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"4px"}},
              h("div",{style:{fontSize:"13px",fontWeight:"800",color:ab.lostCount>0?"#16a34a":"#1e293b"}},"📦 "+ab.date,ab.lostCount>0&&h("span",{style:{marginLeft:"6px",padding:"2px 6px",background:"#16a34a",color:"#fff",fontSize:"10px",borderRadius:"4px"}},"유실 "+ab.lostCount+"건 포함! 🎉")),
              h("div",{style:{fontSize:"10px",color:"#94a3b8"}},ab.sizeMB+"MB")),

            h("div",{style:{display:"flex",gap:"4px"}},
              h("button",{onClick:()=>exportAutoBackup(ab.key,ab.date),disabled:autoExporting===ab.key,style:{flex:1,padding:"8px",borderRadius:"6px",border:"1px solid #93c5fd",background:autoExporting===ab.key?"#e2e8f0":"#eff6ff",color:autoExporting===ab.key?"#94a3b8":"#2563eb",fontSize:"11px",fontWeight:"700",cursor:autoExporting===ab.key?"default":"pointer"}},autoExporting===ab.key?"내보내는 중...":"💾 전체 다운로드"),
              ab.lostCount>0&&h("button",{onClick:()=>exportLostOnly(ab.key,ab.date),disabled:autoExporting===ab.key+"_lost",style:{flex:1,padding:"8px",borderRadius:"6px",border:"1px solid #86efac",background:autoExporting===ab.key+"_lost"?"#e2e8f0":"#f0fdf4",color:autoExporting===ab.key+"_lost"?"#94a3b8":"#16a34a",fontSize:"11px",fontWeight:"700",cursor:autoExporting===ab.key+"_lost"?"default":"pointer"}},autoExporting===ab.key+"_lost"?"추출 중...":"🎯 유실분만 추출"))))),
        autoBackups&&h("button",{onClick:scanAutoBackups,disabled:autoScanning,style:{width:"100%",padding:"8px",borderRadius:"8px",border:"1px solid #cbd5e1",background:"#fff",color:"#64748b",fontSize:"11px",fontWeight:"600",cursor:autoScanning?"default":"pointer",marginBottom:"8px"}},autoScanning?"조회 중...":"🔄 다시 조회"),
        h("div",{style:{borderTop:"1px solid #f1f5f9",margin:"4px 0"}}),
        h("button",{onClick:doReset,style:{display:"flex",alignItems:"center",justifyContent:"center",gap:"8px",padding:"14px",borderRadius:"12px",border:"1px solid #fecaca",background:"#fef2f2",color:"#ef4444",fontSize:"14px",fontWeight:"700",cursor:"pointer"}},"🗑️ 전체 초기화"))));
}

ReactDOM.render(h(App),document.getElementById("root"));
